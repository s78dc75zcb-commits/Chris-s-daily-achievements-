<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chris Daily XP</title>
<style>
*{box-sizing:border-box}
body{
margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
color:#25231f;min-height:100vh;
background:linear-gradient(155deg,#f8dfb6,#f7f3eb 48%,#e8eee7)
}
.app{max-width:600px;margin:auto;padding:20px 16px 40px}
.hero{min-height:275px;padding:15px 5px 25px;display:flex;flex-direction:column;justify-content:end}
.sun{
width:85px;height:85px;border-radius:50%;
background:linear-gradient(145deg,#ffe09a,#e3a04b);
box-shadow:0 0 55px #e9b36d88;margin-bottom:30px;
animation:float 4s ease-in-out infinite
}
@keyframes float{50%{transform:translateY(-6px)}}
.kicker{font-size:12px;letter-spacing:2px;color:#887253;font-weight:800}
h1{font-size:42px;line-height:1;margin:8px 0 11px;letter-spacing:-2px}
.sub{color:#77736b;font-size:15px}
.card{
background:#ffffffb8;backdrop-filter:blur(18px);
border:1px solid #fff;border-radius:25px;
padding:17px;margin-top:12px;
box-shadow:0 15px 40px #6f58301a
}
.levelrow{display:flex;justify-content:space-between;align-items:end}
.level{font-size:25px;font-weight:850}
.xptext{font-size:13px;color:#77736b}
.bar{height:11px;background:#24231f12;border-radius:20px;overflow:hidden;margin-top:13px}
.fill{
height:100%;width:0;border-radius:20px;
background:linear-gradient(90deg,#d38d43,#efc582);
transition:.5s
}
.head{display:flex;justify-content:space-between;align-items:center;margin:25px 3px 10px}
.head h2{margin:0;font-size:21px}
.badge{
font-size:11px;font-weight:800;color:#8b683f;
background:#d79b5220;border-radius:99px;padding:7px 10px
}
.task{
width:100%;display:flex;align-items:center;text-align:left;
gap:13px;padding:15px 8px;border:0;border-bottom:1px solid #24231f10;
background:transparent;color:inherit;cursor:pointer;
min-height:64px;-webkit-tap-highlight-color:transparent
}
.task:active{transform:scale(.985)}
.task:last-child{border-bottom:0}
.circle{
width:36px;height:36px;flex:none;border:2px solid #c9bca8;
border-radius:50%;display:grid;place-items:center;
background:#ffffff80;color:white;transition:.25s
}
.task.done .circle{
background:#687562;border-color:#687562;transform:scale(1.08)
}
.task.done .circle:after{content:"✓";font-size:19px}
.task.done .name{text-decoration:line-through;color:#999}
.name{font-size:15px;font-weight:700;flex:1}
.points{font-size:13px;font-weight:850;color:#a1713d}
.bonus{background:#d79b520b;border-radius:14px;margin:3px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{
padding:15px;border-radius:18px;background:#ffffff8c;
border:1px solid #24231f0d
}
.stat span{font-size:11px;color:#817d75}
.stat b{font-size:25px;display:block;margin-top:3px}
.ach{display:flex;align-items:center;gap:12px;padding:11px 0}
.ach small{display:block;color:#858178;margin-top:3px}
.locked{opacity:.35}
.actions{display:flex;gap:10px;margin-top:15px}
.btn{
flex:1;border:0;border-radius:16px;padding:14px;
font-weight:800;cursor:pointer;background:#292824;color:white
}
.alt{background:#ffffffa8;color:#555;border:1px solid #24231f12}
footer{text-align:center;color:#8b877f;font-size:11px;margin-top:24px}
.pop{
position:fixed;left:50%;top:42%;pointer-events:none;
transform:translate(-50%,20px) scale(.7);
opacity:0;font-weight:900;font-size:30px;color:#a56d35;
z-index:20
}
.pop.show{animation:xp .8s ease-out}
@keyframes xp{
0%{opacity:0;transform:translate(-50%,20px) scale(.7)}
25%{opacity:1;transform:translate(-50%,0) scale(1.15)}
100%{opacity:0;transform:translate(-50%,-65px) scale(1)}
}
.confetti{
position:fixed;left:50%;top:45%;width:8px;height:8px;
border-radius:2px;pointer-events:none;z-index:19;
animation:conf .75s ease-out forwards
}
@keyframes conf{
to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}
}
</style>
</head>

<body>
<main class="app">

<header class="hero">
<div class="sun"></div>
<div class="kicker" id="date"></div>
<h1>Good morning, Chris.</h1>
<div class="sub">Start small. Stack XP. Level up your day.</div>
</header>

<section class="card">
<div class="levelrow">
<div class="level" id="level">Level 1</div>
<div class="xptext" id="xptext">0 / 500 XP</div>
</div>
<div class="bar"><div class="fill" id="fill"></div></div>
</section>

<div class="head">
<h2>🌅 Morning</h2>
<span class="badge" id="mTotal">0 / 80 XP</span>
</div>
<section class="card" id="morning"></section>

<div class="head">
<h2>🌙 Night</h2>
<span class="badge" id="nTotal">0 / 100 XP</span>
</div>
<section class="card" id="night"></section>

<div class="head"><h2>📈 Progress</h2></div>
<section class="card">
<div class="stats">
<div class="stat"><span>🔥 STREAK</span><b id="streak">0</b></div>
<div class="stat"><span>🏆 TOTAL XP</span><b id="total">0</b></div>
</div>
</section>

<div class="head"><h2>🏆 Achievements</h2></div>
<section class="card" id="ach"></section>

<div class="actions">
<button class="btn alt" id="reset">Reset today</button>
<button class="btn" id="finish">Finish day</button>
</div>

<footer>Tap any task to complete it. Progress saves automatically.</footer>
</main>

<div class="pop" id="pop"></div>

<script>
const M=[
["water","💧","Drink a glass of water",10],
["stretch","🧘","Stretch 5–10 minutes",15],
["workout","🏋️","Small workout",25],
["room","🧹","Clean / organize room",15],
["lotion","🧴","Lotion",5],
["deodorant","🧼","Deodorant",5],
["ears","👂","Ear care — outside only",5],
["dog","🐕","Walk the dog • BONUS",20,true],
["shower","🚿","Shower • BONUS",20,true]
];

const N=[
["nshower","🚿","Shower",20],
["ndog","🐕","Walk the dog",20],
["teeth","🪥","Brush teeth",10],
["hygiene","🧼","Night hygiene",10],
["nlotion","🧴","Lotion",5],
["nworkout","🏋️","Small workout / stretch",20],
["nroom","🧹","5-minute room reset",10],
["bed","🛏️","Get ready for bed",5]
];

const KEY="chris_daily_xp_game";
const today=()=>new Date().toISOString().slice(0,10);

let s=JSON.parse(localStorage.getItem(KEY)||"null")||{
xp:0,done:{},streak:0,lastFinish:"",lastOpen:today()
};

if(s.lastOpen!==today()){
s.done={};
s.lastOpen=today();
save();
}

function save(){
localStorage.setItem(KEY,JSON.stringify(s));
}

function all(){
return [...M,...N];
}

function render(arr,id){
const box=document.getElementById(id);
box.innerHTML="";

arr.forEach(x=>{
let [key,icon,name,points,bonus]=x;

let el=document.createElement("button");
el.className="task "+(s.done[key]?"done ":"")+(bonus?"bonus":"");

el.innerHTML=
`<span class="circle"></span>
<span class="name">${icon} ${name}</span>
<span class="points">+${points}</span>`;

el.onclick=()=>toggle(key,points);

box.appendChild(el);
});
}

function toggle(key,points){

if(s.done[key]){
s.done[key]=false;
s.xp=Math.max(0,s.xp-points);
show("-"+points+" XP");
}else{
s.done[key]=true;
s.xp+=points;
show("+"+points+" XP");
burst();
}

save();
update();
}

function show(text){
let p=document.getElementById("pop");
p.textContent=text;
p.classList.remove("show");
void p.offsetWidth;
p.classList.add("show");
}

function burst(){

for(let i=0;i<12;i++){

let d=document.createElement("i");
d.className="confetti";

d.style.setProperty(
"--x",(Math.random()*240-120)+"px"
);

d.style.setProperty(
"--y",(Math.random()*180-90)+"px"
);

document.body.appendChild(d);

setTimeout(()=>d.remove(),800);
}
}

function update(){

render(M,"morning");
render(N,"night");

let mx=M.filter(x=>s.done[x[0]])
.reduce((a,x)=>a+x[3],0);

let nx=N.filter(x=>s.done[x[0]])
.reduce((a,x)=>a+x[3],0);

document.getElementById("mTotal").textContent=
`${mx} / 80 XP`;

document.getElementById("nTotal").textContent=
`${nx} / 100 XP`;

let level=Math.floor(s.xp/500)+1;
let current=s.xp%500;

document.getElementById("level").textContent=
"Level "+level;

document.getElementById("xptext").textContent=
`${current} / 500 XP`;

document.getElementById("fill").style.width=
(current/5)+"%";

document.getElementById("streak").textContent=s.streak;
document.getElementById("total").textContent=s.xp;

achievements();
}

function achievements(){

let data=[
["🌅","Early Bird","7-day streak",s.streak>=7],
["🌙","Night Mode","Complete a full night routine",
N.every(x=>s.done[x[0]])],
["🔥","Consistency","Reach a 7-day streak",s.streak>=7],
["🏆","1000 Club","Reach 1,000 XP",s.xp>=1000],
["⭐","Level 10","Reach Level 10",s.xp>=4500]
];

document.getElementById("ach").innerHTML=
data.map(a=>
`<div class="ach ${a[3]?"":"locked"}">
<div style="font-size:24px">${a[0]}</div>
<div><b>${a[1]}</b><small>${a[2]}</small></div>
</div>`
).join("");
}

document.getElementById("finish").onclick=()=>{

let morningDone=
M.filter(x=>!x[4]).every(x=>s.done[x[0]]);

let nightDone=
N.every(x=>s.done[x[0]]);

if(!morningDone&&!nightDone){
show("Finish more quests");
return;
}

if(s.lastFinish!==today()){

s.streak++;
s.lastFinish=today();

save();
update();

show("DAY COMPLETE 🔥");
burst();

}else{
show("Already finished today");
}
};

document.getElementById("reset").onclick=()=>{

if(confirm("Reset today's completed tasks?")){

all().forEach(x=>{
if(s.done[x[0]]) s.xp-=x[3];
});

s.done={};

save();
update();
show("Reset");
}
};

document.getElementById("date").textContent=
new Date().toLocaleDateString(undefined,{
weekday:"long",
month:"long",
day:"numeric"
}).toUpperCase();

update();
</script>
</body>
</html>
